<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line-up Five 五子连线</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Line-up <span>Five</span></h1>
  <span class="ver" id="vertag"></span>
</header>

<!-- 大厅 -->
<section id="lobby" class="card">
  <div class="tabs">
    <button class="tab active" data-pane="create">开新局</button>
    <button class="tab" data-pane="join">加入局</button>
  </div>
  <div id="pane-create" class="pane">
    <label>人数（2–4人混战）
      <select id="players"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option></select>
    </label>
    <label>空位由 bot 补位
      <select id="bots"><option value="0" selected>全部座位留给我（0 个 bot）</option><option value="auto">部分座位挂 bot</option></select>
    </label>
    <button id="btn-create" class="big">创建对局</button>
    <div id="created" class="hint"></div>
  </div>
  <div id="pane-join" class="pane hidden">
    <label>加入码 <input id="join-code" maxlength="6" placeholder="A1B2C3" autocomplete="off"></label>
    <label>座位 <select id="join-seat"><option value="0">座位0 红</option><option value="1">座位1 蓝</option><option value="2">座位2 绿</option><option value="3">座位3 黄</option></select></label>
    <label>凭证 seatToken <input id="join-token" placeholder="创建者发给你的32位token" autocomplete="off"></label>
    <button id="btn-join" class="big">进入对局</button>
  </div>
</section>

<!-- 对局 -->
<section id="game" class="hidden">
  <div class="topbar card">
    <div><b id="g-code"></b> <span class="hint" id="g-move"></span></div>
    <div id="g-turn" class="turnbadge"></div>
    <div class="status" id="g-status"></div>
  </div>
  <div class="boardwrap card"><div id="board" class="board"></div></div>
  <div class="actions">
    <span id="myseat-hint" class="hint"></span>
    <button id="btn-bots" title="显示 sample bot 补位命令">加 bot 补位</button>
    <button id="btn-resign" class="danger">认输</button>
    <button id="btn-lobby">离开</button>
  </div>
  <pre id="botcmd" class="hidden"></pre>
  <div class="hist card"><h3>对局记录</h3><ol id="hist"></ol></div>
</section>

<div id="banner" class="banner hidden"><div class="binner"><span id="banner-t"></span><button id="banner-x">关闭</button></div></div>

<script src="/app.js"></script>
</body>
</html>
